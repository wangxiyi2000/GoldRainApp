name: gold_rain
description: "搬砖爆金币——上班打卡，金币实时爆屏的情绪价值 App（M0 demo）"
publish_to: "none"
version: 0.6.16+23

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/skins/
    # 皮肤精灵图需逐目录显式声明（目录声明不递归子目录，否则 redpack/yuanbao 的 PNG 打不进 APK）
    - assets/skins/redpack/
    - assets/skins/yuanbao/
    - assets/sounds/
